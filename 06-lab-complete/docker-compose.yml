services:
  agent:
    build: .
    ports:
      - "127.0.0.1:18006:8000"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8000"
      ENVIRONMENT: ${ENVIRONMENT:-development}
      REDIS_URL: redis://redis:6379/0
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-10}
      DAILY_BUDGET_USD: ${DAILY_BUDGET_USD:-1}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-day14-part6}
    depends_on:
      redis:
        condition: service_healthy
    stop_grace_period: 10s
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory 128mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5
    restart: unless-stopped
volumes:
  redis_data:
