# Blueprint path in Render: 06-lab-complete/render.yaml
# Free services for the lab; no cloud resources have been created yet.
services:
  - type: web
    name: day14-agent
    runtime: docker
    plan: free
    region: singapore
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-redis
          property: connectionString
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1"
      - key: REDIS_KEY_PREFIX
        value: day14-part6
  - type: keyvalue
    name: day14-redis
    plan: free
    region: singapore
    maxmemoryPolicy: noeviction
    ipAllowList: []
